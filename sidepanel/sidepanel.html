<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WindCaption · 观语听风字幕</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#f1f2f3;overflow:hidden}
  #frame{width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
<iframe id="frame" src="../panel/panel.html?sidepanel=1"></iframe>
<script>
// 外框背景跟随面板主题，避免暗/亮主题切换时出现割裂边框
(function () {
  function apply(theme, pinned) {
    var t = theme || 'gray';
    if (t === 'system') t = 'auto';
    if (!/^(gray|light|dark|auto)$/.test(t)) t = 'gray';
    if (t === 'auto' && !pinned) t = 'gray';
    if (t === 'auto') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.body.style.background = t === 'dark' ? '#171a21' : (t === 'light' ? '#ffffff' : '#f1f2f3');
  }
  try {
    chrome.storage.local.get('settings', function (d) {
      var s = (d && d.settings) || {};
      apply(s.theme, !!s.themePinned);
    });
  } catch (e) { apply('gray', false); }
})();
</script>
</body>
</html>
